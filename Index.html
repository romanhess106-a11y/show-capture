<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown &amp; Stone — Show Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#141A1D;
    --panel:#1A2226;
    --panel-2:#212B30;
    --line:#2E3B41;
    --text:#E9EBE6;
    --muted:#8E9EA5;
    --brass:#C9A24B;
    --brass-dim:#8A6F34;
    --live:#E2574C;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--brass);outline-offset:2px;
  }

  header{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:18px 22px;border-bottom:1px solid var(--line);
  }
  header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .sub{color:var(--muted);font-size:13px}
  .status{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--muted);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--live);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot.on{animation:none}}

  main{
    display:grid;grid-template-columns:minmax(340px,420px) 1fr;
    gap:22px;padding:22px;align-items:start;
  }
  @media (max-width:900px){main{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .panel h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 14px}

  /* ---- preview ---- */
  .stage{
    position:relative;background:#0C1113;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;aspect-ratio:16/9;
    display:flex;align-items:center;justify-content:center;
  }
  .stage video{width:100%;height:100%;object-fit:contain;display:block}
  .stage .empty{color:var(--muted);font-size:13px;text-align:center;padding:0 24px}
  .stage .badge{
    position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:6px;
    background:rgba(12,17,19,.82);padding:4px 9px;border-radius:20px;
    font-size:11px;font-weight:600;color:var(--text);
  }

  .btn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    border-radius:8px;padding:9px 14px;font-weight:500;
  }
  .btn:hover{border-color:var(--brass-dim)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.wide{width:100%}
  .btn.primary{background:var(--brass);border-color:var(--brass);color:#161011;font-weight:600}
  .btn.primary:hover{background:#D8B25C}
  .btn.ghost{background:transparent}
  .btn.danger:hover{border-color:var(--live);color:var(--live)}

  .capture-btn{
    width:100%;margin-top:14px;padding:20px;border-radius:10px;
    background:var(--brass);border:none;color:#161011;
    font-size:20px;font-weight:700;letter-spacing:-.01em;
  }
  .capture-btn:hover:not(:disabled){background:#D8B25C}
  .capture-btn:active:not(:disabled){transform:translateY(1px)}
  .capture-btn:disabled{background:var(--panel-2);color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

  .row{display:flex;gap:10px;align-items:center;margin-top:14px}
  .row label{font-size:13px;color:var(--muted);flex:0 0 auto}
  .row input[type=range]{flex:1;accent-color:var(--brass)}
  .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;text-align:right}

  input[type=text],select{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-family:inherit;font-size:14px;width:100%;
  }

  .meta{
    display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    font-size:13px;color:var(--muted);
  }
  .meta b{display:block;color:var(--text);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}

  /* ---- gallery ---- */
  .gal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .gal-head h2{margin:0;flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .shot{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .shot img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#0C1113}
  .shot .body{padding:9px 10px 11px}
  .shot input[type=text]{margin-bottom:8px}
  .shot .ctl{display:flex;align-items:center;gap:6px}
  .shot .ctl button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:3px 8px;font-size:12px;line-height:1.4;
  }
  .shot .ctl button:hover{color:var(--text);border-color:var(--brass-dim)}
  .shot .frameno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .shot .spacer{flex:1}
  .shot .time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  .empty-gal{
    border:1px dashed var(--line);border-radius:8px;padding:44px 24px;
    text-align:center;color:var(--muted);font-size:14px;
  }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--brass-dim);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:14px;font-weight:500;
    opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:50;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>Show Capture</h1>
  <span class="sub">Crown &amp; Stone</span>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Not capturing</span>
  </div>
</header>

<main>
  <!-- LEFT: control -->
  <section class="panel">
    <h2>Source</h2>

    <div class="stage" id="stage">
      <div class="empty" id="stageEmpty">Pick the window showing your Whatnot stream when you start.</div>
      <video id="video" autoplay muted playsinline style="display:none"></video>
      <div class="badge" id="badge" style="display:none"><span class="dot on"></span> Buffering</div>
    </div>

    <div class="row">
      <button class="btn wide primary" id="startBtn">Start capturing</button>
      <button class="btn ghost" id="stopBtn" disabled>Stop</button>
    </div>

    <button class="capture-btn" id="grabBtn" disabled>Capture sold item</button>
    <p class="hint">Press <b>Space</b> or <b>C</b> anywhere on this page</p>

    <div class="row">
      <label for="lookback">Look back</label>
      <input type="range" id="lookback" min="0" max="20" step="1" value="6">
      <span class="val" id="lookbackVal">6s</span>
    </div>
    <div class="row">
      <label for="width">Image width</label>
      <input type="range" id="width" min="480" max="1600" step="80" value="960">
      <span class="val" id="widthVal">960</span>
    </div>

    <div class="meta">
      <div><b id="bufSecs">0s</b>buffer held</div>
      <div><b id="shotCount">0</b>captured</div>
      <div><b id="sizeEst">0 MB</b>stored</div>
    </div>
  </section>

  <!-- RIGHT: gallery -->
  <section class="panel">
    <div class="gal-head">
      <h2>Captured this show</h2>
      <button class="btn ghost" id="testBtn">Test trigger</button>
      <button class="btn ghost danger" id="clearBtn">Clear all</button>
      <button class="btn" id="zipBtn">Download all</button>
    </div>
    <div id="gallery"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- config ----------
  const BUFFER_SECONDS = 30;
  const SAMPLE_MS      = 500;          // 2 fps rolling buffer
  const JPEG_QUALITY   = 0.78;
  const CHANNEL_NAME   = 'cs-sold';    // sales sheet posts here
  const DB_NAME        = 'cs-capture';
  const STORE          = 'shots';

  // ---------- state ----------
  let stream = null;
  let sampler = null;
  let buffer = [];            // [{t, dataURL}]
  let shots  = [];            // [{id, label, ts, frames:[3], chosen}]
  let seq    = 0;

  const $ = id => document.getElementById(id);
  const video = $('video');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  // ---------- tiny IndexedDB wrapper ----------
  let db = null;
  function openDB(){
    return new Promise(resolve => {
      let req;
      try { req = indexedDB.open(DB_NAME, 1); }
      catch(e){ return resolve(null); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, {keyPath:'id'});
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => resolve(null);
    });
  }
  function dbPut(rec){
    if(!db) return;
    try { db.transaction(STORE,'readwrite').objectStore(STORE).put(rec); } catch(e){}
  }
  function dbDelete(id){
    if(!db) return;
    try { db.transaction(STORE,'readwrite').objectStore(STORE).delete(id); } catch(e){}
  }
  function dbClear(){
    if(!db) return;
    try { db.transaction(STORE,'readwrite').objectStore(STORE).clear(); } catch(e){}
  }
  function dbAll(){
    return new Promise(resolve => {
      if(!db) return resolve([]);
      try {
        const r = db.transaction(STORE,'readonly').objectStore(STORE).getAll();
        r.onsuccess = () => resolve(r.result || []);
        r.onerror   = () => resolve([]);
      } catch(e){ resolve([]); }
    });
  }

  // ---------- capture source ----------
  async function start(){
    try{
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 15 },
        audio: false
      });
    }catch(err){
      toast(err && err.name === 'NotAllowedError'
        ? 'Screen sharing was declined.'
        : 'This browser blocked screen capture here — open the page directly, not in a preview frame.');
      return;
    }

    video.srcObject = stream;
    video.style.display = 'block';
    $('stageEmpty').style.display = 'none';
    $('badge').style.display = 'flex';

    stream.getVideoTracks()[0].addEventListener('ended', stop);

    sampler = setInterval(sample, SAMPLE_MS);
    $('startBtn').disabled = true;
    $('stopBtn').disabled  = false;
    $('grabBtn').disabled  = false;
    $('dot').classList.add('on');
    $('statusText').textContent = 'Capturing';
  }

  function stop(){
    clearInterval(sampler); sampler = null;
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    video.style.display = 'none';
    $('stageEmpty').style.display = 'block';
    $('badge').style.display = 'none';
    buffer = [];
    $('startBtn').disabled = false;
    $('stopBtn').disabled  = true;
    $('grabBtn').disabled  = true;
    $('dot').classList.remove('on');
    $('statusText').textContent = 'Not capturing';
    $('bufSecs').textContent = '0s';
  }

  function sample(){
    if(!video.videoWidth) return;
    const w = parseInt($('width').value, 10);
    const h = Math.round(w * video.videoHeight / video.videoWidth);
    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    buffer.push({ t: Date.now(), dataURL: canvas.toDataURL('image/jpeg', JPEG_QUALITY) });

    const cutoff = Date.now() - BUFFER_SECONDS * 1000;
    while(buffer.length && buffer[0].t < cutoff) buffer.shift();

    const span = buffer.length ? Math.round((buffer[buffer.length-1].t - buffer[0].t)/1000) : 0;
    $('bufSecs').textContent = span + 's';
  }

  function frameAt(msAgo){
    if(!buffer.length) return null;
    const target = Date.now() - msAgo;
    let best = buffer[0], bestGap = Math.abs(buffer[0].t - target);
    for(const f of buffer){
      const gap = Math.abs(f.t - target);
      if(gap < bestGap){ best = f; bestGap = gap; }
    }
    return best.dataURL;
  }

  // ---------- capturing a sold item ----------
  function grab(label){
    if(!buffer.length){ toast('Nothing buffered yet.'); return; }
    const back = parseInt($('lookback').value, 10) * 1000;
    const frames = [
      frameAt(back + 2500),
      frameAt(back),
      frameAt(Math.max(0, back - 2500))
    ].filter(Boolean);

    const rec = {
      id: 'shot-' + Date.now() + '-' + (++seq),
      label: label || '',
      ts: Date.now(),
      frames,
      chosen: Math.min(1, frames.length - 1)
    };
    shots.unshift(rec);
    dbPut(rec);
    render();
    toast(label ? 'Captured — ' + label : 'Captured');
  }

  // ---------- gallery ----------
  function render(){
    const gal = $('gallery');
    $('shotCount').textContent = shots.length;

    let bytes = 0;
    for(const s of shots) for(const f of s.frames) bytes += f.length * 0.75;
    $('sizeEst').textContent = (bytes/1048576).toFixed(1) + ' MB';

    if(!shots.length){
      gal.innerHTML = '<div class="empty-gal">Captures land here. Each one keeps three frames so you can pick the sharpest.</div>';
      return;
    }

    gal.innerHTML = '<div class="grid"></div>';
    const grid = gal.firstChild;

    shots.forEach(s => {
      const el = document.createElement('div');
      el.className = 'shot';
      const time = new Date(s.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      el.innerHTML =
        '<img alt="">' +
        '<div class="body">' +
          '<input type="text" placeholder="Item name">' +
          '<div class="ctl">' +
            '<button data-a="prev" title="Previous frame">&#9664;</button>' +
            '<span class="frameno"></span>' +
            '<button data-a="next" title="Next frame">&#9654;</button>' +
            '<span class="spacer"></span>' +
            '<span class="time">' + time + '</span>' +
            '<button data-a="save" title="Download this frame">Save</button>' +
            '<button data-a="del" title="Delete">&#215;</button>' +
          '</div>' +
        '</div>';

      const img = el.querySelector('img');
      const inp = el.querySelector('input');
      const no  = el.querySelector('.frameno');
      const paint = () => {
        img.src = s.frames[s.chosen];
        no.textContent = (s.chosen + 1) + '/' + s.frames.length;
      };
      paint();
      inp.value = s.label;

      inp.addEventListener('input', () => { s.label = inp.value; dbPut(s); });
      el.addEventListener('click', e => {
        const a = e.target.getAttribute && e.target.getAttribute('data-a');
        if(!a) return;
        if(a === 'prev'){ s.chosen = (s.chosen - 1 + s.frames.length) % s.frames.length; paint(); dbPut(s); }
        if(a === 'next'){ s.chosen = (s.chosen + 1) % s.frames.length; paint(); dbPut(s); }
        if(a === 'save'){ downloadOne(s); }
        if(a === 'del'){
          shots = shots.filter(x => x.id !== s.id);
          dbDelete(s.id); render();
        }
      });

      grid.appendChild(el);
    });
  }

  function slug(s, i){
    const base = (s.label || '').trim().toLowerCase()
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    const n = String(i).padStart(3,'0');
    return base ? n + '-' + base : n + '-item';
  }

  function downloadOne(s){
    const a = document.createElement('a');
    a.href = s.frames[s.chosen];
    a.download = slug(s, 1) + '.jpg';
    a.click();
  }

  async function downloadZip(){
    if(!shots.length){ toast('Nothing to download yet.'); return; }
    if(typeof JSZip === 'undefined'){ toast('Zip library did not load — check your connection.'); return; }
    toast('Building zip…');
    const zip = new JSZip();
    const ordered = shots.slice().reverse();   // chronological
    ordered.forEach((s, i) => {
      const b64 = s.frames[s.chosen].split(',')[1];
      zip.file(slug(s, i + 1) + '.jpg', b64, {base64:true});
    });
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = 'crown-stone-show-' + d.toISOString().slice(0,10) + '.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // ---------- trigger from the sales sheet ----------
  // In sales-sheet.html, when an item is marked sold:
  //   new BroadcastChannel('cs-sold').postMessage({ label: 'Lot 42 — Gold Cuban' });
  if('BroadcastChannel' in window){
    const ch = new BroadcastChannel(CHANNEL_NAME);
    ch.onmessage = e => {
      const d = e.data || {};
      grab(d.label || d.name || d.title || '');
    };
  }
  // Also usable directly: window.CSCapture.capture('Lot 42')
  window.CSCapture = { capture: grab, shots: () => shots };

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- wiring ----------
  $('startBtn').addEventListener('click', start);
  $('stopBtn').addEventListener('click', stop);
  $('grabBtn').addEventListener('click', () => grab(''));
  $('testBtn').addEventListener('click', () => {
    new BroadcastChannel(CHANNEL_NAME).postMessage({label:'Test item'});
  });
  $('zipBtn').addEventListener('click', downloadZip);
  $('clearBtn').addEventListener('click', () => {
    if(!shots.length) return;
    if(!confirm('Delete all ' + shots.length + ' captures from this show?')) return;
    shots = []; dbClear(); render();
  });

  $('lookback').addEventListener('input', e => { $('lookbackVal').textContent = e.target.value + 's'; });
  $('width').addEventListener('input', e => { $('widthVal').textContent = e.target.value; });

  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.code === 'Space' || e.key === 'c' || e.key === 'C'){
      e.preventDefault();
      if(!$('grabBtn').disabled) grab('');
    }
  });

  // ---------- boot ----------
  (async () => {
    db = await openDB();
    const saved = await dbAll();
    shots = saved.sort((a,b) => b.ts - a.ts);
    render();
  })();

})();
</script>
</body>
</html>
